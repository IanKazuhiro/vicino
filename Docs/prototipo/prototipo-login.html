<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Vicino — Login</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#8F4A22}a:hover{color:#6E3815}
input::placeholder{color:#8A7A6C}
input:focus{outline:none}
</style>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F3EC; font-family: 'Manrope', system-ui, sans-serif; color: #3D3229; box-sizing: border-box">
<div aria-hidden="true" style="position: absolute; width: 340px; height: 340px; top: -110px; right: -120px; border-radius: 50%; background: #C4703F; opacity: 0.55; filter: blur(70px)"></div>
<div aria-hidden="true" style="position: absolute; width: 300px; height: 300px; top: 300px; left: -170px; border-radius: 50%; background: #7E8F63; opacity: 0.5; filter: blur(70px)"></div>
<div aria-hidden="true" style="position: absolute; width: 280px; height: 280px; bottom: -90px; right: -80px; border-radius: 50%; background: #E3A878; opacity: 0.6; filter: blur(70px)"></div>
<div aria-hidden="true" style="position: absolute; width: 170px; height: 170px; bottom: 120px; left: 30px; border-radius: 50%; background: #2E4034; opacity: 0.18; filter: blur(60px)"></div>

<div style="position: relative; z-index: 1; height: 100%; box-sizing: border-box; padding: 64px 24px 32px; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<div style="width: 64px; height: 64px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.45); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 8px 28px rgba(61,50,41,0.12)">
<svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2E4034" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5"></path><path d="M5.5 9v10a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9"></path><path d="M12 17.2s-3-1.8-3-3.9a1.6 1.6 0 0 1 3-.8 1.6 1.6 0 0 1 3 .8c0 2.1-3 3.9-3 3.9z"></path></svg>
</div>
<div style="font-family: 'Fraunces', Georgia, serif; font-size: 44px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; color: #2E4034">vicino</div>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #5E4E41; max-width: 260px">Seu condomínio, mais perto de você.</p>
</div>

<form style="margin: 0; padding: 28px 22px 24px; border-radius: 30px; background: rgba(255,255,255,0.42); backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 12px 40px rgba(61,50,41,0.14); display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; color: #3D3229">Bem-vindo de volta</h1>
<p style="margin: 0; font-size: 14px; color: #5E4E41">Entre para acessar seu condomínio.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="email" style="font-size: 13px; font-weight: 700; color: #3D3229">E-mail</label>
<div style="height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-radius: 16px; background: rgba(255,255,255,0.6); border: 1px solid rgba(61,50,41,0.12)">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A685A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m4 7 8 6 8-6"></path></svg>
<input id="email" type="email" placeholder="voce@email.com" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 15px; color: #3D3229">
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="senha" style="font-size: 13px; font-weight: 700; color: #3D3229">Senha</label>
<div style="height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 16px; border-radius: 16px; background: rgba(255,255,255,0.6); border: 1px solid rgba(61,50,41,0.12)">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A685A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"></rect><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path></svg>
<input id="senha" type="password" placeholder="Sua senha" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 15px; color: #3D3229">
<button type="button" aria-label="Mostrar senha" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A685A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<label for="lembrar" style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5E4E41; cursor: pointer; min-height: 44px">
<input id="lembrar" type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: #2E4034">
Lembrar de mim
</label>
<a href="#" style="font-size: 13px; font-weight: 700; text-decoration: none; min-height: 44px; display: flex; align-items: center">Esqueci a senha</a>
</div>

<a href="prototipo-home.html" style="height: 56px; border-radius: 18px; background: #AD5D2F; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 800; letter-spacing: 0.01em; box-shadow: 0 10px 24px rgba(173,93,47,0.32)">
Entrar
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
</a>
</form>

<p style="margin: 0; text-align: center; font-size: 14px; color: #5E4E41">Primeiro acesso? <a href="#" style="font-weight: 800; text-decoration: none">Ative sua conta</a></p>
</div>
</div>
</body>
</html>
